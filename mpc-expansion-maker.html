<head>
<meta charset="utf-8">

<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">

<meta property="og:description" content="Créez vos kits et expansions MPC avec image, gratuitement. Create MPC drum kits and expansions with cover art, free.">

<meta property="og:url" content="https://guizmoh.github.io/expansion-lab/mpc-expansion-maker.html">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0d10; --panel2:#252931; --line:#2e333c; --line2:#3a404b;
  --text:#eef0f4; --muted:#8c94a3; --dim:#5d6472;
  --red:#ff3b30; --red2:#ff6b3d; --glow:rgba(255,59,48,.55); --ok:#3ddc84; --lcd:#9fffd0; --blue:#13c3ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;color:var(--text);font:14px/1.45 Inter,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 50% -200px,#2a1416 0%,transparent 60%),
             radial-gradient(900px 500px at 100% 100%,#141a24 0%,transparent 60%),var(--bg);}
.display{font-family:Rajdhani,"Segoe UI",sans-serif;letter-spacing:.06em}

/* Header */
header{--b:clamp(26px,6vw,88px);display:flex;align-items:center;gap:12px 16px;padding:20px 28px;max-width:1480px;margin:0 auto;flex-wrap:wrap}
.logo{width:var(--b);height:var(--b);border-radius:calc(var(--b)*.27);background:linear-gradient(145deg,#ff4d3d,#b3140c);display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--b)*.07);padding:calc(var(--b)*.18);box-shadow:0 6px 20px -6px var(--glow),inset 0 1px 0 #ffffff40;flex:none}
.logo i{background:#ffffffd0;border-radius:calc(var(--b)*.045)}
.logo i:nth-child(2n){background:#ffffff55}
header h1{margin:0;font-size:calc(var(--b)/.65);font-weight:700;line-height:.65}
.hbreak{flex-basis:100%;height:0}
header .tagline{flex:1 1 260px;margin:0}
.hbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-left:auto}
header h1 .lw{position:relative;top:calc(var(--b)*.025)}
.xpad{height:.65em;height:1cap;width:auto;vertical-align:0;margin:0 .04em;fill:currentColor}
.lw{white-space:nowrap;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}


header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.hbtn{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line2);padding:7px 12px;border-radius:20px;background:transparent;white-space:nowrap}
.hbtn:hover{color:var(--text)}
.kofi-btn{font-size:13px;font-weight:600;color:#f1d6c4;text-decoration:none;background:#d99a721a;border:1px solid #d99a7250;padding:7px 14px;border-radius:20px;white-space:nowrap}
.kofi-btn:hover{background:#d99a7230;color:#fff}
.langsw{display:inline-flex;border:1px solid var(--line2);border-radius:20px;overflow:hidden;flex:none}
.langsw button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 11px;font-weight:700;font-size:12px}
.langsw button.on{background:var(--red);color:#fff}
#installBtn{display:none}
@media(max-width:700px){.kofi-btn,.hbtn.home{display:none}}

main{display:grid;grid-template-columns:300px minmax(420px,1fr) 320px;gap:20px;padding:0 28px 28px;max-width:1480px;margin:0 auto;align-items:start}
@media(max-width:1180px){main{grid-template-columns:1fr 1fr}.device{grid-column:1/-1;order:-1}}
@media(max-width:760px){main{grid-template-columns:1fr;padding:0 16px 20px}header{padding:16px}}

.card{background:linear-gradient(180deg,#1f2229,#191b21);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 20px 40px -24px #000}
.step{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:15px;font-weight:700;text-transform:uppercase}
.step b{width:24px;height:24px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:13px;color:#fff;box-shadow:0 0 12px var(--glow)}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:12px 0 5px}
input[type=text],textarea{width:100%;background:#111317;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;transition:border-color .15s,box-shadow .15s}
input[type=text]:focus,textarea:focus{outline:0;border-color:var(--red);box-shadow:0 0 0 3px #ff3b3033}
textarea{resize:vertical;min-height:64px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);padding:8px 12px;transition:all .15s}
button:hover{border-color:#5a6170;background:#2d323b}
.btn-main{width:100%;padding:14px;font-size:15px;font-weight:700;border:0;color:#fff;background:linear-gradient(180deg,#ff4d3d,#d91c10);box-shadow:0 10px 24px -10px var(--glow),inset 0 1px 0 #ffffff40}
.btn-main:hover{background:linear-gradient(180deg,#ff5f50,#e8281b);transform:translateY(-1px)}
.btn-wide{width:100%;padding:11px;margin-top:10px}
.muted{color:var(--muted)} .small{font-size:12px}

/* Cover */
#cover{position:relative;aspect-ratio:1;max-width:260px;margin:4px auto 0;border-radius:12px;cursor:pointer;overflow:hidden;background:#111317;border:2px dashed var(--line2);display:grid;place-items:center;text-align:center;transition:all .2s}
#cover:hover{border-color:var(--muted)}
#cover.over{border-color:var(--red);box-shadow:0 0 0 4px #ff3b3033,0 0 30px var(--glow)}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cover.has{border-style:solid;border-color:var(--line2)}
#cover .hint{position:relative;padding:16px;color:var(--muted);font-size:13px}
#cover .hint svg{display:block;margin:0 auto 8px;opacity:.7}
#cover.has .hint{opacity:0;background:#000a;color:#fff;inset:0;position:absolute;display:grid;place-items:center;transition:opacity .2s}
#cover.has:hover .hint{opacity:1}
#coverClear{display:none;margin:10px auto 0}

/* Device */
.device{background:linear-gradient(180deg,#22252c,#15171c);border:1px solid #30353f;border-radius:20px;padding:18px;box-shadow:0 30px 60px -30px #000,inset 0 1px 0 #ffffff12}
.lcd{background:linear-gradient(180deg,#0a1210,#07100d);border:1px solid #1d2b26;border-radius:10px;padding:12px 14px;margin-bottom:14px;box-shadow:inset 0 2px 10px #000}
.lcd-top{display:flex;align-items:center;gap:10px}
.lcd input{background:transparent;border:0;padding:2px 0;color:var(--lcd);font:600 22px Rajdhani,sans-serif;letter-spacing:.05em;text-shadow:0 0 8px #9fffd066;flex:1;min-width:0}
.lcd input:focus{box-shadow:none;border-bottom:1px solid #9fffd055;border-radius:0}
.lcd-info{color:#5fbf96;font:500 13px Rajdhani,sans-serif;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:16px;margin-top:2px;align-items:center}
.lcd-info .sp{flex:1}
#modeBtn{background:#0f1f19;border:1px solid #2b4a3d;color:var(--lcd);font:600 13px Rajdhani,sans-serif;letter-spacing:.08em;padding:4px 10px;border-radius:6px}
#modeBtn:hover{background:#163126}
.kits{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.kits button{padding:6px 12px;font-size:13px;border-radius:20px}
.kits button.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 14px -2px var(--glow)}
.kits .del{margin-left:auto;background:transparent;border-color:transparent;color:var(--muted)}
.kits .del:hover{color:var(--red);border-color:var(--line2)}
.banks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px auto 0;max-width:520px}
.banks button{position:relative;padding:8px 0;font:700 15px Rajdhani,sans-serif;background:linear-gradient(180deg,#2c3038,#1f2228);border-color:#3a3f49;box-shadow:0 2px 0 #0a0b0d}
.banks button.on{background:linear-gradient(180deg,#ff4d3d,#c91a0f);border-color:#ff5a4a;color:#fff;box-shadow:0 0 16px -2px var(--glow),0 2px 0 #5a0b06}
.banks .dot{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
#pads{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px;background:#0b0c0f;border-radius:14px;box-shadow:inset 0 3px 12px #000}
.pad{aspect-ratio:1;position:relative;border-radius:10px;cursor:pointer;user-select:none;min-width:0;overflow:hidden;touch-action:none;
  background:linear-gradient(160deg,#3a3e47,#2a2d34);border:1px solid #474c57;box-shadow:0 3px 0 #111,inset 0 1px 0 #ffffff14;transition:transform .06s,box-shadow .15s,border-color .15s}
.pad>*{pointer-events:none}
.pad:hover{border-color:#6a7180}
.pad .id{position:absolute;top:6px;left:8px;font:700 12px Rajdhani,sans-serif;color:#8a909c;letter-spacing:.05em}
.pad .key{position:absolute;top:6px;right:8px;font:600 10px Inter;color:#5d6472}
.pad .plus{position:absolute;inset:0;display:grid;place-items:center;color:#5d6472;font-size:26px;font-weight:300}
.pad canvas{position:absolute;left:6px;right:6px;top:26%;width:calc(100% - 12px);height:36%}
.pad .nm{position:absolute;left:8px;right:8px;bottom:6px;font-size:11px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .mode{position:absolute;right:6px;bottom:22px;font:700 9px Rajdhani,sans-serif;letter-spacing:.08em;padding:1px 5px;border-radius:4px;background:#0008;color:#ffb3a8}
.pad .mode.noteon{background:#13c3ff33;color:#8fe4ff}
.pad.full{background:linear-gradient(160deg,#4a2320,#2b2226 70%);border-color:#8a2a22}
.pad.full .id{color:#ff8a7a}
.pad .tool{pointer-events:auto;position:absolute;top:4px;width:22px;height:22px;padding:0;border-radius:50%;font-size:11px;background:#000b;border:0;opacity:0}
.pad .x{right:4px} .pad .gear{right:30px}
.pad.full:hover .tool{opacity:1}
.pad.full:hover .key{opacity:0}
.pad .x:hover{background:var(--red)} .pad .gear:hover{background:var(--blue);color:#06222c}
.pad.over{border-color:var(--red2);box-shadow:0 0 0 3px #ff6b3d55,0 0 24px var(--glow);transform:scale(1.03)}
.pad.hit{transform:translateY(2px) scale(.98);box-shadow:0 1px 0 #111,0 0 30px 4px var(--glow);background:linear-gradient(160deg,#ff5a45,#c5180d);border-color:#ff8a7a}
.pad.hit .id,.pad.hit .nm{color:#fff}
.pad.dragging{opacity:.4}
.help{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:14px;color:var(--muted);font-size:12px}
.help span::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--red);margin-right:6px;vertical-align:middle}

/* Library */
.libhead{display:flex;gap:8px;margin-bottom:10px}
.libhead input{flex:1;padding:8px 10px}
#libDrop{border:2px dashed var(--line2);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s}
#libDrop:hover{border-color:var(--muted);color:var(--text)}
#libDrop.over{border-color:var(--red);color:var(--text);box-shadow:0 0 20px -4px var(--glow)}
#lib{list-style:none;margin:10px 0 0;padding:0;max-height:330px;overflow-y:auto}
#lib li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;cursor:grab;border:1px solid transparent}
#lib li:hover{background:#ffffff08;border-color:var(--line)}
#lib li:active{cursor:grabbing}
#lib li.used .t::after{content:"●";color:var(--ok);font-size:8px;margin-left:6px;vertical-align:middle}
#lib li canvas{width:46px;height:22px;flex:none}
#lib li .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#lib li .grip{color:var(--dim);font-size:12px;letter-spacing:-2px}
#lib li button{padding:2px 7px;font-size:11px;border-radius:6px;opacity:0}
#lib li:hover button{opacity:1}
.libfoot{display:flex;gap:8px;margin-top:10px}
.libfoot button{flex:1;font-size:12px;padding:8px}

/* Preview tile / export */
.tile{display:flex;gap:12px;align-items:center;background:#0e1013;border:1px solid var(--line);border-radius:12px;padding:10px}
.tile img{width:64px;height:64px;border-radius:8px;object-fit:cover;flex:none;box-shadow:0 4px 12px #000}
.tile b{display:block;font-size:15px}
#status{margin-top:12px;min-height:20px;font-size:13px;color:var(--ok)}
#status.err{color:var(--red2)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
details{margin-top:16px} summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13px}
ol{margin:10px 0 0;padding-left:20px;color:var(--muted);font-size:13px} ol li{margin-bottom:6px}
code{background:var(--panel2);padding:1px 6px;border-radius:5px;color:var(--text)}
.kofi-card{display:none;margin-top:14px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#2a1d17,#16181d);border:1px solid #d99a7240;text-align:center}
.kofi-card.on{display:block;animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kofi-card p{margin:0 0 10px;font-size:13px;color:#c3c8d2}
.kofi-card a{display:inline-block;background:linear-gradient(180deg,#e3ab85,#c4825b);color:#2a150b;font-weight:700;text-decoration:none;padding:9px 18px;border-radius:10px}
.kofi-foot{display:block;margin-top:14px;text-align:center;font-size:12px;color:var(--muted);text-decoration:none}
.kofi-foot:hover{color:#e3ab85}

/* Playback mode dialog */
dialog{background:linear-gradient(180deg,#1f2229,#16181d);color:var(--text);border:1px solid var(--line2);border-radius:18px;padding:0;width:min(640px,calc(100vw - 32px));max-height:min(760px,calc(100vh - 40px));box-shadow:0 40px 80px -20px #000}
dialog::backdrop{background:#000a;backdrop-filter:blur(3px)}
.dlg-head{display:flex;align-items:center;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dlg-head h2{margin:0;font-size:20px;flex:1}
.dlg-head button{border-radius:50%;width:34px;height:34px;padding:0}
.dlg-body{padding:16px 20px;overflow-y:auto;max-height:calc(min(760px,100vh - 40px) - 140px)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:520px){.modes{grid-template-columns:1fr}}
.mcard{background:#111317;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mcard b{display:block;font:700 16px Rajdhani,sans-serif;letter-spacing:.06em;margin-bottom:2px}
.mcard.os b{color:#ff8a7a} .mcard.no b{color:#8fe4ff}
.mcard p{margin:0;color:var(--muted);font-size:12.5px}
.mcard button{margin-top:10px;width:100%;font-size:12px;padding:7px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid transparent}
.prow:nth-child(odd){background:#ffffff05}
.prow.flash{border-color:var(--blue);box-shadow:0 0 0 3px #13c3ff33}
.prow .pid{font:700 14px Rajdhani,sans-serif;color:#ff8a7a;width:36px}
.prow .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .play{width:32px;height:32px;padding:0;border-radius:50%;flex:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;border-radius:0;background:transparent;color:var(--muted);padding:6px 10px;font:700 12px Rajdhani,sans-serif;letter-spacing:.06em}
.seg button.on.os{background:var(--red);color:#fff}
.seg button.on.no{background:var(--blue);color:#06222c}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.dlg-foot{padding:12px 20px 18px;border-top:1px solid var(--line);text-align:right}
.dlg-foot button{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;padding:10px 22px}

/* Overlay */
#overlay{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .2s;z-index:50;
  background:radial-gradient(circle at 50% 50%,#ff3b3018,#0008);box-shadow:inset 0 0 0 4px var(--red),inset 0 0 80px var(--glow)}
#overlay.on{opacity:1}
#overlay div{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:var(--red);color:#fff;font-weight:700;padding:10px 20px;border-radius:30px;box-shadow:0 10px 30px var(--glow)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:#1f2229;border:1px solid var(--line2);padding:10px 18px;border-radius:30px;transition:all .25s;z-index:60;box-shadow:0 10px 30px #000;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#333842;border-radius:4px}
</style>
</head>
<body>
<header>
  <a href="./" class="logo" data-i18n-title="home"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></a>
  <h1 class="display brandtitle"><span class="sr">Expansion Lab</span><span class="lw" aria-hidden="true">E<svg class="xpad" viewBox="0 0 100 100" aria-hidden="true"><rect x="0" y="0" width="22" height="22" rx="4"/><rect x="26" y="26" width="22" height="22" rx="4"/><rect x="52" y="52" width="22" height="22" rx="4"/><rect x="78" y="78" width="22" height="22" rx="4"/><rect x="78" y="0" width="22" height="22" rx="4"/><rect x="52" y="26" width="22" height="22" rx="4"/><rect x="26" y="52" width="22" height="22" rx="4"/><rect x="0" y="78" width="22" height="22" rx="4"/></svg>PANSION LAB</span></h1>
  <div class="hbreak"></div>
  <p class="tagline" data-i18n="tagline"></p>
  <div class="hbtns">
  <button class="hbtn" id="installBtn" data-i18n="install"></button>
  <a href="https://ko-fi.com/omnipotard" target="_blank" rel="noopener" class="kofi-btn" data-i18n="kofiBtn" data-i18n-title="kofiTitle"></a>
  <a href="./" class="hbtn home" id="homeLink" data-i18n="homeBack"></a>
  <div class="langsw" role="group" aria-label="Langue / Language">
    <button data-lang="fr">FR</button><button data-lang="en">EN</button>
  </div>
  </div>
</header>

<main>
  <!-- 1. Expansion -->
  <section class="card">
    <h2 class="step display"><b>1</b><span data-i18n="step1"></span></h2>
    <div id="cover"><div class="hint"></div></div>
    <div style="text-align:center"><button id="coverClear" class="small" data-i18n="coverClear"></button></div>
    <label for="expName" data-i18n="expName"></label>
    <input type="text" id="expName" maxlength="50">
    <label for="expAuthor" data-i18n="expAuthor"></label>
    <input type="text" id="expAuthor" data-i18n-ph="expAuthorPh" maxlength="50">
    <label for="expDesc" data-i18n="expDesc"></label>
    <textarea id="expDesc" maxlength="300"></textarea>
    <input type="file" id="imgFile" accept="image/*" hidden>
  </section>

  <!-- 2. Device -->
  <section class="device">
    <div class="kits" id="kits"></div>
    <div class="lcd">
      <div class="lcd-top"><span style="color:#5fbf96;font:600 13px Rajdhani">KIT</span><input type="text" id="kitName" maxlength="50" aria-label="Kit"></div>
      <div class="lcd-info"><span id="lcdBank"></span><span id="lcdCount"></span><span class="sp"></span><button id="modeBtn" data-i18n="modeBtn"></button></div>
    </div>
    <div id="pads"></div>
    <div class="banks" id="banks"></div>
    <div class="help">
      <span data-i18n="help1"></span>
      <span data-i18n="help2"></span>
      <span data-i18n="help3"></span>
      <span data-i18n="help4"></span>
    </div>
    <input type="file" id="sndFile" accept="audio/*,.wav,.aif,.aiff,.mp3,.flac,.ogg" multiple hidden>
  </section>

  <!-- 3. Library + export -->
  <div style="display:grid;gap:20px">
    <section class="card">

async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].map(it => it.webkitGetAsEntry && it.webkitGetAsEntry()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async entry => {
    if (entry.isFile) out.push(await new Promise((res, rej) => entry.file(res, rej)).catch(() => null));
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      let batch;
      do {
        batch = await new Promise(res => reader.readEntries(res, () => res([])));
        for (const e of batch) await walk(e);
      } while (batch.length);
    }
  };
  for (const e of entries) await walk(e);

}

/* ---------- Audio ---------- */
function parseWav(buf) {
  const dv = new DataView(buf);
  if (dv.byteLength < 44 || dv.getUint32(0) !== 0x52494646 || dv.getUint32(8) !== 0x57415645) return null;
  let p = 12, fmt = null, dataSize = null;
  while (p + 8 <= dv.byteLength) {
    const id = dv.getUint32(p), size = dv.getUint32(p + 4, true);
    if (id === 0x666d7420 && size >= 16) {
      fmt = { tag: dv.getUint16(p + 8, true), ch: dv.getUint16(p + 10, true), align: dv.getUint16(p + 20, true), bits: dv.getUint16(p + 22, true) };
    } else if (id === 0x64617461) { dataSize = Math.min(size, dv.byteLength - p - 8); break; }
    p += 8 + size + (size & 1);
  }
  if (!fmt || dataSize === null || !fmt.align) return null;
  if (![1, 3, 0xFFFE].includes(fmt.tag) || fmt.ch < 1 || fmt.ch > 2) return null;
  if (![8, 16, 24, 32].includes(fmt.bits)) return null;
  return { frames: Math.floor(dataSize / fmt.align) };
}
function encodeWav(ab) {
  const ch = Math.min(2, ab.numberOfChannels), n = ab.length;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const str = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  str(0, "RIFF"); out.setUint32(4, 36 + n * ch * 2, true); str(8, "WAVEfmt ");
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, ab.sampleRate, true); out.setUint32(28, ab.sampleRate * ch * 2, true);
  out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); str(36, "data"); out.setUint32(40, n * ch * 2, true);
  const data = []; for (let c = 0; c < ch; c++) data.push(ab.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) {
    const v = Math.max(-1, Math.min(1, data[c][i]));

}

}

function play(sample, el) {
  if (!sample) return () => {};
  if (el) { el.classList.remove("hit"); void el.offsetWidth; el.classList.add("hit"); setTimeout(() => el.classList.remove("hit"), 140); }

    const src = c.createBufferSource(), g = c.createGain();

    return () => { try { g.gain.setTargetAtTime(0, c.currentTime, 0.015); src.stop(c.currentTime + 0.08); } catch (e) {} };
  }
  const a = new Audio(sample.url); a.play().catch(() => {});
  return () => a.pause();
}

  const dpr = window.devicePixelRatio || 1, w = canvas.clientWidth || 46, h = canvas.clientHeight || 22;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext("2d"); g.scale(dpr, dpr); g.fillStyle = color;
  if (!peaks) { g.fillRect(0, h / 2 - .5, w, 1); return; }
  const bw = w / peaks.length;
  peaks.forEach((p, i) => { const bh = Math.max(1, p * h); g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1), bh); });
}

function drawDefault(title, size = 1000) {

  const gr = g.createRadialGradient(500 * k, 300 * k, 50 * k, 500 * k, 500 * k, 800 * k);
  gr.addColorStop(0, "#3a1714"); gr.addColorStop(1, "#0b0c0f"); g.fillStyle = gr; g.fillRect(0, 0, size, size);

  const cv = $("cover"); cv.querySelector("img")?.remove();
  const title = $("expName").value.trim() || t("defName");
  if (state.imageUrl) {
    const im = new Image(); im.src = state.imageUrl; cv.prepend(im); cv.classList.add("has");

/* ---------- Rendu ---------- */
function swapPads(a, b) {
  const P = kit().pads, M = kit().modes;
  [P[a], P[b]] = [P[b], P[a]]; [M[a], M[b]] = [M[b], M[a]];
}
function render() {
  const kits = $("kits"); kits.innerHTML = "";
  state.kits.forEach((k, i) => {
    const b = document.createElement("button"); b.textContent = k.name || t("noName");
    if (i === state.cur) b.className = "on";
    b.onclick = () => { state.cur = i; state.bank = 0; render(); };
    b.ondragover = e => { e.preventDefault(); if (state.cur !== i) { state.cur = i; render(); } };
    kits.appendChild(b);
  });
  const add = document.createElement("button"); add.textContent = t("newKit");
  add.onclick = () => { state.kits.push(newKit(t("kit") + " " + (state.kits.length + 1))); state.cur = state.kits.length - 1; state.bank = 0; render(); };
  kits.appendChild(add);
  if (state.kits.length > 1) {
    const del = document.createElement("button"); del.className = "del"; del.textContent = t("delKit");
    del.onclick = () => { if (!confirm(t("confirmDel", kit().name))) return; state.kits.splice(state.cur, 1); state.cur = Math.max(0, state.cur - 1); state.bank = 0; render(); };
    kits.appendChild(del);
  }
  if (document.activeElement !== $("kitName")) $("kitName").value = kit().name;
  $("lcdBank").textContent = t("bank") + " " + BANKS[state.bank];
  $("lcdCount").textContent = kit().pads.filter(Boolean).length + " / 128 pads";

  const banks = $("banks"); banks.innerHTML = "";
  [...BANKS].forEach((L, b) => {
    const el = document.createElement("button"); el.textContent = L;
    if (b === state.bank) el.className = "on";
    if (kit().pads.slice(b * 16, b * 16 + 16).some(Boolean)) el.insertAdjacentHTML("beforeend", '<span class="dot"></span>');
    el.onclick = () => { state.bank = b; render(); };
    el.ondragover = e => { e.preventDefault(); if (state.bank !== b) { state.bank = b; render(); } };
    banks.appendChild(el);
  });

  const pads = $("pads"); pads.innerHTML = "";
  for (let row = 3; row >= 0; row--) for (let col = 0; col < 4; col++) {
    const local = row * 4 + col, i = state.bank * 16 + local, p = kit().pads[i], mode = kit().modes[i];
    const el = document.createElement("div"); el.className = "pad" + (p ? " full" : ""); el.dataset.i = i;
    el.innerHTML = `<span class="id">${padLabel(i)}</span><span class="key">${KEY_LABEL(KEYS[local])}</span>`;
    if (p) {
      const cv = document.createElement("canvas"); el.appendChild(cv);
      el.insertAdjacentHTML("beforeend", `<span class="mode ${mode}">${MODE_LABEL[mode]}</span>`);
      const nm = document.createElement("div"); nm.className = "nm"; nm.textContent = p.name; el.appendChild(nm);
      const gear = document.createElement("button"); gear.className = "tool gear"; gear.textContent = "⚙"; gear.title = t("padMode");
      gear.onpointerdown = e => e.stopPropagation();
      gear.onclick = e => { e.stopPropagation(); openModes(i); };
      const x = document.createElement("button"); x.className = "tool x"; x.textContent = "✕"; x.title = t("clearPad");
      x.onpointerdown = e => e.stopPropagation();
      x.onclick = e => { e.stopPropagation(); kit().pads[i] = null; kit().modes[i] = "oneshot"; render(); };
      el.append(gear, x);
      el.draggable = true;
      el.ondragstart = e => { stopHeld(); e.dataTransfer.setData("text/x-pad", String(i)); e.dataTransfer.effectAllowed = "move"; el.classList.add("dragging"); };
      el.ondragend = () => el.classList.remove("dragging");
      el.onpointerdown = e => { if (e.button === 0) { stopHeld(); held = playPad(i, el); } };
      el.oncontextmenu = e => { e.preventDefault(); openModes(i); };
      requestAnimationFrame(() => drawWave(cv, p.peaks, mode === "noteon" ? "#8fe4ff" : "#ff6b55"));
    } else {
      el.insertAdjacentHTML("beforeend", '<span class="plus">+</span>');
      el.onclick = () => { state.target = i; $("sndFile").click(); };
    }
    let depth = 0;
    el.ondragenter = e => { e.preventDefault(); depth++; el.classList.add("over"); };
    el.ondragover = e => { e.preventDefault(); e.dataTransfer.dropEffect = hasFiles(e) ? "copy" : "move"; };
    el.ondragleave = () => { if (--depth <= 0) { depth = 0; el.classList.remove("over"); } };
    el.ondrop = async e => {
      e.preventDefault(); e.stopPropagation(); el.classList.remove("over"); hideOverlay();
      const src = e.dataTransfer.getData("text/x-pad"), lib = e.dataTransfer.getData("text/x-lib");
      if (src !== "") { swapPads(+src, i); render(); }
      else if (lib !== "") { kit().pads[i] = state.lib[+lib]; render(); play(kit().pads[i], document.querySelector(`.pad[data-i="${i}"]`)); }
      else if (hasFiles(e)) {
        const files = await filesFromDrop(e.dataTransfer);
        if (files.some(isAudio)) addToPads(files, i);
        else if (files.some(isImage)) setImage(files.find(isImage));
      }
    };
    pads.appendChild(el);
  }
  renderLib();
  const total = state.kits.reduce((n, k) => n + k.pads.filter(Boolean).length, 0);
  $("tileTitle").textContent = $("expName").value.trim() || t("defName");
  $("tileSub").textContent = t("tileSub", $("expAuthor").value.trim() || "Custom", state.kits.length, total);
}
function renderLib() {
  const q = $("libSearch").value.trim().toLowerCase(), used = new Set(state.kits.flatMap(k => k.pads.filter(Boolean)));
  const ul = $("lib"); ul.innerHTML = "";
  $("libTools").style.display = $("libFoot").style.display = state.lib.length ? "flex" : "none";
  state.lib.forEach((s, idx) => {
    if (q && !s.name.toLowerCase().includes(q)) return;
    const li = document.createElement("li"); li.draggable = true; li.title = t("libItem");
    if (used.has(s)) li.className = "used";
    li.innerHTML = '<span class="grip">⋮⋮</span>';
    const cv = document.createElement("canvas"); li.appendChild(cv);
    const tt = document.createElement("span"); tt.className = "t"; tt.textContent = s.name; li.appendChild(tt);
    const rm = document.createElement("button"); rm.textContent = "✕"; rm.title = t("remove");
    rm.onclick = e => { e.stopPropagation(); state.lib.splice(idx, 1); render(); };
    li.appendChild(rm);
    li.onclick = () => play(s);
    li.ondragstart = e => { e.dataTransfer.setData("text/x-lib", String(idx)); e.dataTransfer.effectAllowed = "copy"; };
    ul.appendChild(li);
    requestAnimationFrame(() => drawWave(cv, s.peaks, used.has(s) ? "#3ddc84" : "#8c94a3"));
  });
}

/* ---------- Génération XPM ---------- */
function layerXml(n, name, frames) {
  return `<Layer number="${n}"><Active>True</Active><Volume>1.000000</Volume><Pan>0.500000</Pan><Pitch>0.000000</Pitch>` +
    `<TuneCoarse>0</TuneCoarse><TuneFine>0</TuneFine><VelStart>0</VelStart><VelEnd>127</VelEnd>` +
    `<SampleStart>0</SampleStart><SampleEnd>${frames}</SampleEnd><Loop>False</Loop><LoopStart>0</LoopStart><LoopEnd>0</LoopEnd>` +
    `<LoopCrossfadeLength>0</LoopCrossfadeLength><LoopTune>0</LoopTune><Mute>False</Mute><RootNote>0</RootNote><KeyTrack>False</KeyTrack>` +
    `<SampleName>${xml(name)}</SampleName><SampleFile></SampleFile><SliceIndex>129</SliceIndex><Direction>0</Direction><Offset>0</Offset>` +
    `<SliceStart>0</SliceStart><SliceEnd>${frames}</SliceEnd><SliceLoopStart>0</SliceLoopStart><SliceLoop>0</SliceLoop></Layer>\n`;
}
const SENDS = "<Send1>0.000000</Send1><Send2>0.000000</Send2><Send3>0.000000</Send3><Send4>0.000000</Send4>";
function instrumentXml(n, name, frames, oneShot) {
  return `<Instrument number="${n}">\n<CueBusEnable>False</CueBusEnable>` +
    `<AudioRoute><AudioRoute>0</AudioRoute><AudioRouteSubIndex>0</AudioRouteSubIndex><InsertsEnabled>True</InsertsEnabled></AudioRoute>` +
    SENDS + `<Volume>0.707946</Volume><Mute>False</Mute><Solo>False</Solo><Pan>0.500000</Pan><AutomationFilter>1</AutomationFilter>` +
    `<TuneCoarse>0</TuneCoarse><TuneFine>0</TuneFine><Mono>True</Mono><Polyphony>1</Polyphony><FilterKeytrack>0.000000</FilterKeytrack>` +
    `<LowNote>0</LowNote><HighNote>127</HighNote><IgnoreBaseNote>False</IgnoreBaseNote><ZonePlay>1</ZonePlay><MuteGroup>0</MuteGroup>` +
    `<MuteTarget1>0</MuteTarget1><MuteTarget2>0</MuteTarget2><MuteTarget3>0</MuteTarget3><MuteTarget4>0</MuteTarget4>` +
    `<SimultTarget1>0</SimultTarget1><SimultTarget2>0</SimultTarget2><SimultTarget3>0</SimultTarget3><SimultTarget4>0</SimultTarget4>` +
    `<LfoPitch>0.000000</LfoPitch><LfoCutoff>0.000000</LfoCutoff><LfoVolume>0.000000</LfoVolume><LfoPan>0.000000</LfoPan>` +
    `<OneShot>${oneShot ? "True" : "False"}</OneShot><FilterType>2</FilterType><Cutoff>1.000000</Cutoff><Resonance>0.000000</Resonance><FilterEnvAmt>0.000000</FilterEnvAmt>` +
    `<AfterTouchToFilter>0.000000</AfterTouchToFilter><VelocityToStart>0.000000</VelocityToStart><VelocityToFilterAttack>0.000000</VelocityToFilterAttack>` +
    `<VelocityToFilter>0.000000</VelocityToFilter><VelocityToFilterEnvelope>0.000000</VelocityToFilterEnvelope>` +
    `<FilterAttack>0.000000</FilterAttack><FilterDecay>0.047244</FilterDecay><FilterSustain>1.000000</FilterSustain><FilterRelease>0.000000</FilterRelease>` +
    `<FilterHold>0.000000</FilterHold><FilterDecayType>True</FilterDecayType><FilterADEnvelope>True</FilterADEnvelope>` +
    `<VolumeHold>0.000000</VolumeHold><VolumeDecayType>True</VolumeDecayType><VolumeADEnvelope>True</VolumeADEnvelope>` +
    `<VolumeAttack>0.000000</VolumeAttack><VolumeDecay>0.047244</VolumeDecay><VolumeSustain>1.000000</VolumeSustain><VolumeRelease>0.000000</VolumeRelease>` +
    `<VelocityToPitch>0.000000</VelocityToPitch><VelocityToVolumeAttack>0.000000</VelocityToVolumeAttack>` +
    `<VelocitySensitivity>1.000000</VelocitySensitivity><VelocityToPan>0.000000</VelocityToPan>\n<Layers>\n` +
    layerXml(1, name, frames) + layerXml(2, "", 0) + layerXml(3, "", 0) + layerXml(4, "", 0) +
    `</Layers>\n</Instrument>\n`;
}
function buildXpm(kitName, k, nameOf) {
  let s = `<?xml version="1.0" encoding="UTF-8"?>\n\n<MPCVObject>\n<Version><File_Version>1.7</File_Version><Application>MPC-V</Application>` +
    `<Application_Version>2.10.0.0</Application_Version><Platform>Windows</Platform></Version>\n` +
    `<Program type="Drum">\n<ProgramName>${xml(kitName)}</ProgramName>\n` +
    `<AudioRoute><AudioRoute>2</AudioRoute><AudioRouteSubIndex>0</AudioRouteSubIndex><InsertsEnabled>True</InsertsEnabled></AudioRoute>` +
    SENDS + `<Volume>0.707946</Volume><Mute>False</Mute><Solo>False</Solo><Pan>0.500000</Pan><AutomationFilter>1</AutomationFilter>` +
    `<Pitch>0.000000</Pitch><TuneCoarse>0</TuneCoarse><TuneFine>0</TuneFine><Mono>False</Mono><Program_Polyphony>128</Program_Polyphony>` +
    `<PortamentoTime>0.000000</PortamentoTime><PortamentoLegato>False</PortamentoLegato><PortamentoQuantized>False</PortamentoQuantized>\n<Instruments>\n`;
  for (let i = 0; i < 128; i++) { const p = k.pads[i]; s += instrumentXml(i + 1, p ? nameOf.get(p) : "", p ? p.frames : 0, k.modes[i] !== "noteon"); }
  s += `</Instruments>\n<PadNoteMap>\n`;
  for (let i = 0; i < 128; i++) s += `<PadNote number="${i + 1}"><Note>${PAD_NOTES[i]}</Note></PadNote>\n`;
  s += `</PadNoteMap>\n<PadGroupMap>\n`;
  for (let i = 0; i < 128; i++) s += `<PadGroup number="${i + 1}"><Group>0</Group></PadGroup>\n`;
  return s + `</PadGroupMap>\n</Program>\n</MPCVObject>\n`;
}
function buildExpansionXml(title, author, desc, img) {
  const slug = (title + "." + author).toLowerCase().replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "") || "custom";
  return `<?xml version="1.0" encoding="UTF-8"?>\n\n<expansion version="2.0.0.0" buildVersion="2.10.0.0">\n  <local/>\n` +
    `  <identifier>com.expansionlab.${slug}</identifier>\n  <title>${xml(title)}</title>\n  <manufacturer>${xml(author)}</manufacturer>\n` +
    `  <version>1.0.0.0</version>\n  <type>drum</type>\n  <priority>50</priority>\n  <img>${xml(img)}</img>\n` +
    `  <description>${xml(desc)}</description>\n  <separator>-</separator>\n</expansion>\n`;
}

/* ---------- ZIP (sans compression) ---------- */
const CRC = (() => { const tb = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; tb[n] = c; } return tb; })();
function crc32(u8) { let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC[(c ^ u8[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files) {
  const enc = new TextEncoder(), parts = [], central = [], d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let off = 0, cdSize = 0;
  for (const f of files) {
    const n = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x800, true);
    lh.setUint16(10, time, true); lh.setUint16(12, date, true); lh.setUint32(14, crc, true);
    lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, n.length, true);
    parts.push(lh.buffer, n, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x800, true);
    ch.setUint16(12, time, true); ch.setUint16(14, date, true); ch.setUint32(16, crc, true);
    ch.setUint32(20, sz, true); ch.setUint32(24, sz, true); ch.setUint16(28, n.length, true); ch.setUint32(42, off, true);
    central.push(ch.buffer, n); cdSize += 46 + n.length; off += 30 + n.length + sz;
  }
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, cdSize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, e.buffer], { type: "application/zip" });
}

/* ---------- Export ---------- */
async function buildPackage(asExpansion) {
  const enc = new TextEncoder();
  const kits = (asExpansion ? state.kits : [kit()]).filter(k => k.pads.some(Boolean));
  if (!kits.length) throw new Error(t("needSound"));
  const title = sanitize($("expName").value) || sanitize(t("defName"));
  const folder = asExpansion ? title : (sanitize(kits[0].name) || "Kit");
  const files = [], used = new Set(), nameOf = new Map(), usedKits = new Set();
  const unique = (base, set) => { let n = base, i = 2; while (set.has(n.toLowerCase())) n = base + "_" + i++; set.add(n.toLowerCase()); return n; };
  for (const k of kits) {
    for (const p of k.pads) if (p && !nameOf.has(p)) {
      const n = unique(p.name, used); nameOf.set(p, n);
      files.push({ name: `${folder}/${n}.wav`, data: p.bytes });
    }
    const kn = unique(sanitize(k.name) || "Kit", usedKits);
    files.unshift({ name: `${folder}/${kn}.xpm`, data: enc.encode(buildXpm(kn, k, nameOf)) });
  }
  if (asExpansion) {
    const img = state.image || await canvasBlob(drawDefault($("expName").value.trim() || title));
    const imgName = title + ".jpg";
    files.unshift({ name: `${folder}/${imgName}`, data: new Uint8Array(await img.arrayBuffer()) });
    files.unshift({ name: `${folder}/Expansion.xml`, data: enc.encode(buildExpansionXml(title, sanitize($("expAuthor").value) || "Custom", $("expDesc").value.trim(), imgName)) });
  }
  return { folder, files, blob: makeZip(files) };
}
async function doExport(asExpansion) {
  try {
    status(t("preparing"));
    const pkg = await buildPackage(asExpansion);
    const a = document.createElement("a"); a.href = URL.createObjectURL(pkg.blob); a.download = pkg.folder + ".zip";
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
    status(t("downloaded", pkg.folder, pkg.files.length));
    $("kofiCard").classList.add("on"); $("kofiFoot").style.display = "none";
  } catch (e) { status(e.message, true); }
}

/* ---------- Glisser-déposer global ---------- */
let dragDepth = 0;
const overlay = $("overlay");
function hideOverlay() { dragDepth = 0; overlay.classList.remove("on"); }
window.addEventListener("dragenter", e => { if (hasFiles(e)) { dragDepth++; overlay.classList.add("on"); } });
window.addEventListener("dragleave", e => { if (hasFiles(e) && --dragDepth <= 0) hideOverlay(); });
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", async e => {
  e.preventDefault(); hideOverlay();
  if (!hasFiles(e)) return;
  const files = await filesFromDrop(e.dataTransfer);
  const img = files.find(isImage);
  if (img && !files.some(isAudio)) setImage(img); else addToLib(files);
});
function dropZone(el, onFiles) {
  let d = 0;
  el.addEventListener("dragenter", e => { if (hasFiles(e)) { d++; el.classList.add("over"); } });
  el.addEventListener("dragleave", () => { if (--d <= 0) { d = 0; el.classList.remove("over"); } });
  el.addEventListener("drop", async e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); e.stopPropagation(); d = 0; el.classList.remove("over"); hideOverlay();
    onFiles(await filesFromDrop(e.dataTransfer));
  });
}
dropZone($("cover"), files => { const img = files.find(isImage); img ? setImage(img) : toast(t("dropImg")); });
dropZone($("libDrop"), files => addToLib(files));

  if (local >= 0) { const i = state.bank * 16 + local; heldKeys[e.code] = playPad(i, document.querySelector(`.pad[data-i="${i}"]`)); }
  else if (e.key === "ArrowLeft") { state.bank = (state.bank + 7) % 8; render(); }
  else if (e.key === "ArrowRight") { state.bank = (state.bank + 1) % 8; render(); }
});
window.addEventListener("keyup", e => { if (heldKeys[e.code]) { heldKeys[e.code](); delete heldKeys[e.code]; } });

/* ---------- Appli installable (Windows / PWA) ---------- */
let installEvt = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; $("installBtn").style.display = "inline-block"; });
$("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice; installEvt = null; $("installBtn").style.display = "none"; };
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});

/* ---------- Démarrage ---------- */
$("expName").value = t("defName");
applyLang(); render(); renderCover();
if (document.fonts) document.fonts.ready.then(() => { if (!state.image) renderCover(); });
</script>
</body>
</html>
